<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Sanmeigaku Ecosystem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8 font-sans">

    <div class="flex flex-wrap gap-4 justify-center items-center bg-slate-50 border border-slate-200 p-6 rounded-2xl mb-8">
            <input type="number" id="day" placeholder="DD" class="w-20 p-3 rounded-xl border text-center text-lg font-bold outline-none focus:ring-2 focus:ring-indigo-500">
            <input type="number" id="month" placeholder="MM" class="w-20 p-3 rounded-xl border text-center text-lg font-bold outline-none focus:ring-2 focus:ring-indigo-500">
            <input type="number" id="year" placeholder="YYYY" class="w-32 p-3 rounded-xl border text-center text-lg font-bold outline-none focus:ring-2 focus:ring-indigo-500">
            
            <div class="cf-turnstile" data-sitekey="0x4AAAAAADjf_8n6ghaTqRBf" data-theme="light"></div>

            <button onclick="calculateProfile()" id="execBtn" class="bg-indigo-900 hover:bg-indigo-800 text-white font-extrabold px-8 py-3 rounded-xl transition shadow-md">Map Destiny Grid</button>
        </div>

        <div id="loader" class="hidden text-center py-12 animate-pulse text-indigo-600">
            <div class="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <p class="font-bold">Building Multi-Pillar Matrices & Processing Context Strings...</p>
        </div>

        <div id="dashboard" class="hidden space-y-8">
            
            <div class="bg-slate-900 p-6 rounded-3xl border border-slate-950 shadow-inner">
                <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-2">
                    <h2 class="text-lg font-bold text-slate-200 tracking-wider uppercase">☯ Structural Yin/Yang Chart Grid</h2>
                    <span id="tenchuBadge" class="bg-rose-500/20 text-rose-400 border border-rose-500/30 text-xs font-black px-3 py-1 rounded-full cursor-pointer" onclick="showMeta('Tenchusatsu')"></span>
                </div>
                
                <div class="grid grid-cols-3 gap-3 md:gap-4 max-w-2xl mx-auto text-center">
                    <div id="cell_nw" onclick="showMeta('NW')" class="p-4 bg-slate-800 border border-slate-700/50 rounded-xl cursor-pointer hover:bg-indigo-950 transition text-slate-300">
                        <span class="text-[10px] uppercase text-slate-500 font-bold block mb-1">Right Shoulder</span>
                        <div class="font-black text-sm md:text-base text-amber-400" id="val_nw"></div>
                    </div>
                    <div id="cell_n" onclick="showMeta('N')" class="p-4 bg-slate-800/80 border border-slate-700/50 rounded-xl cursor-pointer hover:bg-indigo-950 transition text-slate-100">
                        <span class="text-[10px] uppercase text-indigo-400 font-bold block mb-1">Head (North)</span>
                        <div class="font-black text-base md:text-lg" id="val_n"></div>
                    </div>
                    <div class="p-4 bg-slate-950/40 rounded-xl flex items-center justify-center text-xs text-slate-600 font-bold">
                        [ 空白 ]
                    </div>

                    <div id="cell_w" onclick="showMeta('W')" class="p-4 bg-slate-800/80 border border-slate-700/50 rounded-xl cursor-pointer hover:bg-indigo-950 transition text-slate-100">
                        <span class="text-[10px] uppercase text-indigo-400 font-bold block mb-1">Right Hand (West)</span>
                        <div class="font-black text-base md:text-lg" id="val_w"></div>
                    </div>
                    <div id="cell_c" onclick="showMeta('C')" class="p-4 bg-indigo-950 border-2 border-indigo-500 rounded-xl cursor-pointer hover:bg-indigo-900 transition text-white shadow-lg relative">
                        <span class="text-[10px] uppercase text-indigo-300 font-bold block mb-1">Chest (Core)</span>
                        <div class="font-black text-lg md:text-xl text-yellow-300" id="val_c"></div>
                    </div>
                    <div id="cell_e" onclick="showMeta('E')" class="p-4 bg-slate-800/80 border border-slate-700/50 rounded-xl cursor-pointer hover:bg-indigo-950 transition text-slate-100">
                        <span class="text-[10px] uppercase text-indigo-400 font-bold block mb-1">Left Hand (East)</span>
                        <div class="font-black text-base md:text-lg" id="val_e"></div>
                    </div>

                    <div id="cell_sw" onclick="showMeta('SW')" class="p-4 bg-slate-800 border border-slate-700/50 rounded-xl cursor-pointer hover:bg-indigo-950 transition text-slate-300">
                        <span class="text-[10px] uppercase text-slate-500 font-bold block mb-1">Right Leg</span>
                        <div class="font-black text-sm md:text-base text-amber-400" id="val_sw"></div>
                    </div>
                    <div id="cell_s" onclick="showMeta('S')" class="p-4 bg-slate-800/80 border border-slate-700/50 rounded-xl cursor-pointer hover:bg-indigo-950 transition text-slate-100">
                        <span class="text-[10px] uppercase text-indigo-400 font-bold block mb-1">Belly (South)</span>
                        <div class="font-black text-base md:text-lg" id="val_s"></div>
                    </div>
                    <div id="cell_se" onclick="showMeta('SE')" class="p-4 bg-slate-800 border border-slate-700/50 rounded-xl cursor-pointer hover:bg-indigo-950 transition text-slate-300">
                        <span class="text-[10px] uppercase text-slate-500 font-bold block mb-1">Left Leg</span>
                        <div class="font-black text-sm md:text-base text-amber-400" id="val_se"></div>
                    </div>
                </div>

                <div id="metaDrawer" class="hidden mt-6 bg-slate-950 border border-slate-800 p-5 rounded-2xl animate-fadeIn">
                    <h4 id="drawerTitle" class="font-black text-indigo-400 text-sm tracking-wider uppercase mb-1"></h4>
                    <p id="drawerContent" class="text-sm text-slate-300 leading-relaxed"></p>
                </div>
            </div>

            <div>
                <h2 class="text-xl font-bold mb-4 text-slate-900">👥 Database Relational Proximity</h2>
                <div id="proximityMatrix" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
            </div>

            <div>
                <h2 class="text-xl font-bold mb-4 text-slate-900">🧠 Advanced AI Generative Profile</h2>
                <div id="aiOutput" class="prose prose-indigo max-w-none bg-white border border-slate-200 p-6 md:p-8 rounded-2xl shadow-sm text-slate-700 leading-relaxed space-y-4"></div>
            </div>
        </div>

    <script>
        let runtimeChart = null;

        async function calculateProfile() {
            const day = document.getElementById('day').value;
            const month = document.getElementById('month').value;
            const year = document.getElementById('year').value;

            if(!day || !month || !year) return alert("All date blocks require inputs.");
   
            // ADD TURNSTILE CHECK
            const cfToken = turnstile.getResponse();
            if (!cfToken) {
                return alert("Please complete the security check before proceeding.");
            }
            
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('metaDrawer').classList.add('hidden');

            try {
                // Ensure this points to your deployed Render service url
                
                const response = await fetch("https://sanmei-project.onrender.com/api/analyze", {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ day: parseInt(day), month: parseInt(month), year: parseInt(year), cf_token: cfToken })
                });

                if(!response.ok) throw new Error("API Pipeline Exception");
                const data = await response.json();
                runtimeChart = data.chart;

                // Map Grid Elements
                document.getElementById('tenchuBadge').innerText = data.chart.tenchusatsu;
                document.getElementById('val_n').innerText = data.chart.head;
                document.getElementById('val_c').innerText = data.chart.chest;
                document.getElementById('val_s').innerText = data.chart.stomach;
                document.getElementById('val_e').innerText = data.chart.left_hand;
                document.getElementById('val_w').innerText = data.chart.right_hand;
                document.getElementById('val_nw').innerText = data.chart.right_shoulder;
                document.getElementById('val_sw').innerText = data.chart.right_leg;
                document.getElementById('val_se').innerText = data.chart.left_leg;

                // Render Proximity Framework
                const proxContainer = document.getElementById('proximityMatrix');
                proxContainer.innerHTML = '';
                
                data.proximity_chart.forEach(item => {
                    proxContainer.innerHTML += `
                        <div class="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm">
                            <div class="flex justify-between items-center mb-2">
                                <h3 class="font-extrabold text-slate-900">${item.name}</h3>
                                <span class="text-xs px-2 py-0.5 rounded-md font-bold bg-indigo-50 border border-indigo-200 text-indigo-700">${item.proximity}% Alignment</span>
                            </div>
                            <p class="text-xs font-medium text-slate-400 mb-2">${item.domain}</p>
                            <p class="text-xs text-slate-600 bg-slate-50 p-3 rounded-xl border border-slate-100">${item.themes}</p>
                        </div>
                    `;
                });

                document.getElementById('aiOutput').innerHTML = marked.parse(data.ai_synthesis);
                document.getElementById('dashboard').classList.remove('hidden');

            } catch(err) {
                alert(`Error: ${err.message}`);
                console.error(err);
            } finally {
                document.getElementById('loader').classList.add('hidden');
                // RESET TURNSTILE AFTER EVERY ATTEMPT
                turnstile.reset();
            }
        }

        function showMeta(pos) {
            if(!runtimeChart) return;
            const drawer = document.getElementById('metaDrawer');
            const title = document.getElementById('drawerTitle');
            const body = document.getElementById('drawerContent');
            
            drawer.classList.remove('hidden');

            if(pos === 'N') {
                title.innerText = `Head Star (North) • ${runtimeChart.head}`;
                body.innerText = runtimeChart.head_meaning;
            } else if(pos === 'C') {
                title.innerText = `Chest Star (Core Ego) • ${runtimeChart.chest}`;
                body.innerText = runtimeChart.chest_meaning;
            } else if(pos === 'Tenchusatsu') {
                title.innerText = `Active Cycle • ${runtimeChart.tenchusatsu}`;
                body.innerText = runtimeChart.tenchusatsu_meaning;
            } else {
                title.innerText = "Yin Chart Position Map Element";
                body.innerText = "Calculated relative structural value. Click the core 'Head' or 'Chest' stars to pull complete definitions parsed from your underlying database reference files.";
            }
        }
    </script>
</body>
</html>
