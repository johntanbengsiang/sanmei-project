<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>算命学 · Sanmeigaku</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --void:    #06060F;
    --deep:    #0B0B18;
    --card:    #10101E;
    --raised:  #17172A;
    --glow:    #1E1E35;
    --ink:     rgba(255,255,255,0.04);
    --vi:      #7C6FEB;
    --vi-dim:  rgba(124,111,235,0.15);
    --vi-glow: rgba(124,111,235,0.35);
    --gold:    #E8B86D;
    --gold-dim:rgba(232,184,109,0.12);
    --teal:    #4ECDC4;
    --teal-dim:rgba(78,205,196,0.12);
    --rose:    #FF6B9D;
    --t1:      #F0EEF8;
    --t2:      #9E98BE;
    --t3:      #524E6E;
    --b1:      rgba(124,111,235,0.12);
    --b2:      rgba(124,111,235,0.35);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}

body{
    background:var(--void);
    color:var(--t1);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
}

/* ── STARS ── */
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.s{position:absolute;border-radius:50%;background:#fff;
   animation:twk var(--t) ease-in-out infinite alternate;
   animation-delay:var(--d)}
@keyframes twk{from{opacity:var(--lo)}to{opacity:var(--hi)}}

/* ── PAGE ── */
.page{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:0 1.5rem 6rem}

/* ── HEADER ── */
header{
    text-align:center;
    padding:3.5rem 0 2rem;
    position:relative;
}
.kanji{
    font-family:'Noto Serif JP',serif;
    font-size:clamp(2.8rem,7vw,5rem);
    font-weight:300;
    letter-spacing:.25em;
    background:linear-gradient(145deg,#a89cf5 0%,#7C6FEB 40%,#E8B86D 80%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    line-height:1.1;margin-bottom:.4rem;
}
.romaji{
    font-size:.65rem;letter-spacing:.45em;text-transform:uppercase;
    color:var(--t3);font-weight:500;
}
.hairline{width:48px;height:1px;background:linear-gradient(90deg,transparent,var(--vi),transparent);margin:1.4rem auto}

/* ── INPUT PANEL ── */
.input-panel{
    background:var(--card);
    border:1px solid var(--b1);
    border-radius:20px;
    padding:1.75rem 2rem;
    display:flex;flex-wrap:wrap;gap:1rem;
    align-items:flex-end;justify-content:center;
    margin-bottom:3rem;
    box-shadow:0 0 60px rgba(124,111,235,.05);
}
.field-group{display:flex;gap:.6rem;align-items:flex-end}
.field label{
    display:block;font-size:.58rem;letter-spacing:.22em;
    text-transform:uppercase;color:var(--t3);margin-bottom:.35rem;text-align:center
}
.field input{
    background:var(--raised);border:1px solid var(--b1);
    color:var(--t1);border-radius:10px;padding:.7rem .5rem;
    font-size:1.05rem;font-weight:600;text-align:center;
    font-family:'Noto Serif JP',serif;outline:none;
    transition:border-color .2s,box-shadow .2s;
}
.field input:focus{border-color:var(--vi);box-shadow:0 0 0 3px var(--vi-dim)}
.field input[placeholder="DD"]{width:62px}
.field input[placeholder="MM"]{width:62px}
.field input[placeholder="YYYY"]{width:88px}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}

.btn{
    background:linear-gradient(135deg,var(--vi),#5B50D9);
    color:#fff;border:none;border-radius:11px;
    padding:.8rem 1.8rem;font-size:.78rem;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
    transition:opacity .2s,transform .15s,box-shadow .2s;
    box-shadow:0 4px 24px rgba(124,111,235,.35);
    white-space:nowrap;
}
.btn:hover{opacity:.88;transform:translateY(-1px);box-shadow:0 6px 32px rgba(124,111,235,.5)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}

/* ── LOADER ── */
#loader{display:none;text-align:center;padding:4rem 0}
.spinner{
    width:42px;height:42px;
    border:2px solid rgba(124,111,235,.15);
    border-top-color:var(--vi);
    border-radius:50%;animation:spin .75s linear infinite;
    margin:0 auto 1.25rem
}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-msg{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--t3)}

/* ── SECTION LABEL ── */
.sec-head{
    display:flex;align-items:center;gap:.9rem;margin-bottom:1.4rem;
}
.sec-head h2{
    font-size:.6rem;letter-spacing:.32em;text-transform:uppercase;
    color:var(--t3);white-space:nowrap;font-weight:600
}
.sec-head::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--b1),transparent)}

/* ── DASHBOARD ── */
#dashboard{display:none}
.section{margin-bottom:2.8rem}

/* ─────────────────────────────────────────
   CHART GRID
───────────────────────────────────────── */
.chart-card{
    background:var(--card);border:1px solid var(--b1);
    border-radius:22px;padding:1.8rem;
    position:relative;overflow:hidden;
}
.chart-card::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 70% 50% at 50% -10%,rgba(124,111,235,.08),transparent);
}
.chart-topbar{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:1.6rem;
}
.chart-title{
    font-family:'Noto Serif JP',serif;font-size:1rem;font-weight:400;
    color:var(--t1);letter-spacing:.08em;
}
.void-pill{
    background:rgba(255,107,157,.1);border:1px solid rgba(255,107,157,.28);
    color:var(--rose);font-size:.7rem;font-family:'Noto Serif JP',serif;
    padding:.3rem .85rem;border-radius:100px;cursor:pointer;
    transition:background .2s;letter-spacing:.04em;
}
.void-pill:hover{background:rgba(255,107,157,.2)}

/* Two-column layout */
.dual{
    display:grid;
    grid-template-columns:1fr 1px 1fr;
    gap:0 1.5rem;
}
@media(max-width:640px){
    .dual{grid-template-columns:1fr;gap:1.5rem 0}
    .divider-v{display:none}
}
.divider-v{background:var(--b1)}
.col-label{
    text-align:center;font-size:.58rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--t3);margin-bottom:1rem;font-weight:600
}

/* ── YIN GRID ── */
.yin-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:auto auto auto auto;
    gap:0;
}
/* Header row spanning 3 cols */
.yin-col-header{
    text-align:center;padding:.4rem .25rem .6rem;
    font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;
    color:var(--t3);font-weight:600;
}
.yin-cell{
    border:1px solid rgba(124,111,235,.07);
    padding:.65rem .3rem;text-align:center;
    background:var(--raised);
    transition:background .18s;
}
.yin-cell:hover{background:var(--glow)}
/* Rounded corners on outer cells */
.yin-cell.r-tl{border-radius:10px 0 0 0}
.yin-cell.r-tr{border-radius:0 10px 0 0}
.yin-cell.r-bl{border-radius:0 0 0 10px}
.yin-cell.r-br{border-radius:0 0 10px 0}
.yin-cell.highlight{background:rgba(124,111,235,.1);border-color:rgba(124,111,235,.22)}

.yin-sub{font-size:.52rem;color:var(--t3);letter-spacing:.1em;margin-bottom:.25rem}
.yin-val{
    font-family:'Noto Serif JP',serif;font-size:1.15rem;font-weight:700;color:var(--t1)
}
.yin-val.day{color:var(--vi);font-size:1.2rem}

/* Tenchusatsu footer in yin section */
.yin-void-row{
    margin-top:.8rem;
    background:rgba(255,107,157,.07);
    border:1px solid rgba(255,107,157,.18);
    border-radius:10px;padding:.6rem;text-align:center;
    cursor:pointer;transition:background .18s;
}
.yin-void-row:hover{background:rgba(255,107,157,.14)}
.yin-void-label{font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,107,157,.55);margin-bottom:.25rem}
.yin-void-val{font-family:'Noto Serif JP',serif;font-size:.95rem;color:var(--rose);letter-spacing:.05em}

/* ── YANG GRID ── */
/* Reference layout (3×3, positions matter):
   [NW driver] [N head  ] [empty    ]
   [W  hand  ] [C chest ] [E hand   ]
   [SW driver] [S belly ] [SE driver]
   Plus top-right area: [天印 top-right], [牽牛 right mid]
   Matching the screenshot exactly:
   Row0: empty   | 貫索  | 天印
   Row1: 石門    | 牽牛  | 牽牛
   Row2: 天堂    | 玉堂  | 天報
*/
.yang-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:.45rem;
}
.yang-cell{
    border-radius:10px;padding:.6rem .3rem;
    text-align:center;min-height:62px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;
    transition:transform .15s,box-shadow .18s,background .15s;
}
.yang-cell:hover{transform:translateY(-2px)}
.yang-cell.empty{background:transparent;border:1px dashed rgba(255,255,255,.04);cursor:default}
.yang-cell.empty:hover{transform:none}

.yang-cell.main{background:var(--raised);border:1px solid var(--b1)}
.yang-cell.main:hover{background:var(--glow);box-shadow:0 4px 16px rgba(78,205,196,.1)}

.yang-cell.core{
    background:linear-gradient(140deg,rgba(124,111,235,.22),rgba(78,205,196,.12));
    border:1px solid var(--vi);
    box-shadow:0 0 24px rgba(124,111,235,.18),inset 0 0 24px rgba(124,111,235,.05);
}
.yang-cell.core:hover{box-shadow:0 0 32px rgba(124,111,235,.3),inset 0 0 24px rgba(124,111,235,.08)}

.yang-cell.driver{background:var(--gold-dim);border:1px solid rgba(232,184,109,.2)}
.yang-cell.driver:hover{background:rgba(232,184,109,.18);box-shadow:0 4px 14px rgba(232,184,109,.12)}

.yc-label{font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:.3rem}
.yang-cell.core .yc-label{color:rgba(165,150,255,.7)}
.yang-cell.driver .yc-label{color:rgba(232,184,109,.5)}

.yc-val{
    font-family:'Noto Serif JP',serif;font-weight:700;line-height:1;font-size:.95rem;
    color:var(--teal)
}
.yang-cell.core .yc-val{color:var(--gold);font-size:1.15rem}
.yang-cell.driver .yc-val{color:var(--gold);font-size:.88rem}

/* ── META DRAWER ── */
#metaDrawer{
    display:none;margin-top:1.25rem;
    background:var(--void);border:1px solid var(--b2);
    border-radius:14px;padding:1.25rem 1.5rem;
    animation:sd .22s ease;
}
@keyframes sd{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
#drawerTitle{
    font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;
    color:var(--vi);margin-bottom:.65rem;font-weight:700
}
#drawerContent{font-size:.85rem;color:var(--t2);line-height:1.85}

/* ─────────────────────────────────────────
   PROXIMITY
───────────────────────────────────────── */
.prox-card{
    background:var(--card);border:1px solid var(--b1);
    border-radius:22px;padding:1.8rem;overflow:hidden;position:relative;
}
#proxViz{width:100%;aspect-ratio:1/1;position:relative}
#proxSvg{width:100%;height:100%;cursor:grab}
#proxSvg:active{cursor:grabbing}
.prox-legend{
    display:flex;gap:1.8rem;justify-content:center;
    margin-top:1rem;flex-wrap:wrap
}
.leg{display:flex;align-items:center;gap:.45rem;font-size:.65rem;color:var(--t3);letter-spacing:.1em}
.leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.zoom-controls{
    position:absolute;top:.6rem;right:.6rem;
    display:flex;flex-direction:column;gap:.3rem;z-index:10;
}
.zoom-btn{
    width:28px;height:28px;border-radius:8px;border:1px solid var(--b2);
    background:var(--raised);color:var(--t2);font-size:1rem;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .15s,color .15s;user-select:none;
}
.zoom-btn:hover{background:var(--ink);color:var(--t1)}

/* Node detail modal (replaces the old hover tooltip — works on tap,
   scrolls, never gets cropped since it's fixed to the viewport) */
.node-modal-backdrop{
    position:fixed;inset:0;background:rgba(6,6,15,.7);
    display:flex;align-items:center;justify-content:center;
    padding:1.5rem;z-index:1000;opacity:0;pointer-events:none;
    transition:opacity .18s;
}
.node-modal-backdrop.open{opacity:1;pointer-events:auto}
.node-modal{
    position:relative;background:var(--raised);border:1px solid var(--b2);
    border-radius:16px;padding:1.5rem 1.6rem;max-width:380px;width:100%;
    max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.node-modal-close{
    position:absolute;top:.6rem;right:.7rem;width:30px;height:30px;
    border-radius:50%;border:none;background:transparent;color:var(--t2);
    font-size:1.3rem;line-height:1;cursor:pointer;
}
.node-modal-close:hover{background:var(--ink);color:var(--t1)}
.tn{font-weight:700;color:var(--gold);margin-bottom:.3rem;font-family:'Noto Serif JP',serif;font-size:.95rem;padding-right:1.5rem}
.td{color:var(--t3);font-size:.7rem;margin-bottom:.3rem;line-height:1.6}
.tt{margin-top:.5rem;color:var(--t2);font-size:.78rem;line-height:1.7}
.nm-placeholder{color:var(--t3);font-style:italic}
.nm-stars{font-family:'Noto Serif JP',serif;color:var(--vi);font-size:.7rem;margin-bottom:.5rem}

/* Wiki row: image left, link right */
.nm-wiki-row{display:flex;align-items:flex-start;gap:.9rem;margin:.65rem 0 .5rem}
.nm-img-wrap{flex-shrink:0;width:70px;height:70px;border-radius:10px;overflow:hidden;
    border:1px solid var(--b1);background:var(--card)}
.nm-img{width:100%;height:100%;object-fit:cover;display:block}
.nm-img-shimmer{width:100%;height:100%;
    background:linear-gradient(90deg,var(--card) 25%,var(--raised) 50%,var(--card) 75%);
    background-size:200% 100%;animation:shimmer 1.3s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.nm-img-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    font-size:1.8rem;font-weight:700;color:var(--t3);font-family:'Noto Serif JP',serif}
.nm-wiki-link{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;
    color:var(--vi);text-decoration:none;border:1px solid var(--b1);
    border-radius:8px;padding:.3rem .65rem;margin-top:.2rem;transition:background .15s}
.nm-wiki-link:hover{background:var(--vi-dim);color:var(--t1)}

/* ─────────────────────────────────────────
   AI INTERPRETATION
───────────────────────────────────────── */
.ai-card{
    background:var(--card);border:1px solid var(--b1);
    border-radius:22px;padding:2.2rem;
    position:relative;overflow:hidden;
}
.ai-card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--vi) 35%,var(--teal) 65%,transparent);
}
.ai-header{
    display:flex;align-items:center;gap:.7rem;
    margin-bottom:1.5rem;padding-bottom:1.25rem;
    border-bottom:1px solid var(--b1);
}
.ai-dot{
    width:7px;height:7px;border-radius:50%;background:var(--teal);
    animation:dotpulse 1.6s ease-in-out infinite;
}
.ai-dot.done{background:var(--gold);animation:none}
@keyframes dotpulse{
    0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(78,205,196,.4)}
    50%{opacity:.5;box-shadow:0 0 0 5px rgba(78,205,196,0)}
}
.ai-status{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--t3)}

#aiOut{font-size:.88rem;line-height:1.9;color:var(--t2)}
#aiOut h1,#aiOut h2,#aiOut h3{
    font-family:'Noto Serif JP',serif;font-weight:400;letter-spacing:.05em;
    margin:1.8rem 0 .7rem;color:var(--t1)
}
#aiOut h1{font-size:1.25rem;color:#a89cf5}
#aiOut h2{
    font-size:1rem;padding-bottom:.5rem;
    border-bottom:1px solid var(--b1)
}
#aiOut h3{font-size:.9rem;color:var(--teal)}
#aiOut strong{color:var(--gold);font-weight:600}
#aiOut em{color:#a89cf5;font-style:italic}
#aiOut p{margin-bottom:.95rem}
#aiOut ul,#aiOut ol{padding-left:1.4rem;margin-bottom:.95rem}
#aiOut li{margin-bottom:.35rem}
#aiOut li::marker{color:var(--vi)}
#aiOut blockquote{
    border-left:2px solid var(--vi);padding:.7rem 1.2rem;margin:1rem 0;
    background:var(--raised);border-radius:0 8px 8px 0;
    color:var(--t2);font-style:italic
}
#aiOut hr{border:none;border-top:1px solid var(--b1);margin:1.5rem 0}

.shimmer{
    height:13px;background:var(--raised);border-radius:6px;
    margin-bottom:.7rem;animation:shim 1.6s ease-in-out infinite
}
@keyframes shim{0%,100%{opacity:.3}50%{opacity:.65}}
</style>
</head>
<body>

<!-- STAR FIELD -->
<div id="stars"></div>

<div class="page">

<!-- HEADER -->
<header>
    <div class="kanji">算命学</div>
    <div class="romaji">Sanmeigaku · Destiny Matrix System</div>
    <div class="hairline"></div>
    <a href="galaxy.html" style="
        display:inline-flex;align-items:center;gap:.45rem;margin-top:.6rem;
        padding:.32rem .85rem;border-radius:10px;border:1px solid var(--b1);
        background:var(--raised);color:var(--t2);font-size:.72rem;
        text-decoration:none;letter-spacing:.06em;transition:all .15s;
    " onmouseover="this.style.borderColor='var(--vi)';this.style.color='var(--t1)'"
       onmouseout="this.style.borderColor='var(--b1)';this.style.color='var(--t2)'">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="2"/><path d="M12 2a10 10 0 1 0 0 20"/><path d="M12 12l4-4"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="18" r="2"/></svg>
        性格銀河 · Character Galaxy
    </a>
</header>

<!-- INPUT -->
<div class="input-panel">
    <div class="field-group">
        <div class="field"><label>Day</label><input type="number" id="day" placeholder="DD" min="1" max="31"></div>
        <div class="field"><label>Month</label><input type="number" id="month" placeholder="MM" min="1" max="12"></div>
        <div class="field"><label>Year</label><input type="number" id="year" placeholder="YYYY" min="1900" max="2100"></div>
    </div>
    <div class="cf-turnstile" data-sitekey="0x4AAAAAADjf_8n6ghaTqRBf" data-theme="dark"></div>
    <button class="btn" id="execBtn" onclick="calculateProfile()">Cast Destiny Grid</button>
</div>

<!-- LOADER -->
<div id="loader">
    <div class="spinner"></div>
    <p class="loader-msg" id="loaderMsg">Aligning solar-lunar bridge…</p>
</div>

<!-- DASHBOARD -->
<div id="dashboard">

    <!-- ── CHART ── -->
    <div class="section">
        <div class="sec-head"><h2>陰陽星図 · Yin-Yang Chart Grid</h2></div>
        <div class="chart-card">
            <div class="chart-topbar">
                <span class="chart-title">人体星図</span>
                <span class="void-pill" id="voidPill" onclick="showMeta('void')"></span>
            </div>

            <div class="dual">
                <!-- YIN -->
                <div>
                    <div class="col-label">陰占 · Yin Pillars</div>
                    <div class="yin-grid" id="yinGrid"></div>
                    <div class="yin-void-row" onclick="showMeta('void')">
                        <div class="yin-void-label">天中殺</div>
                        <div class="yin-void-val" id="voidVal"></div>
                    </div>
                </div>

                <div class="divider-v"></div>

                <!-- YANG -->
                <div>
                    <div class="col-label">陽占 · Human Body Stars</div>
                    <div class="yang-grid" id="yangGrid"></div>
                </div>
            </div>

            <!-- META DRAWER -->
            <div id="metaDrawer">
                <div id="drawerTitle"></div>
                <div id="drawerContent"></div>
            </div>
        </div>
    </div>

    <!-- ── MIND MAP ── -->
    <div class="section">
        <div class="sec-head"><h2>歴史的相関図 · Connections Mind Map</h2></div>
        <div class="prox-card">
            <div id="proxViz">
                <svg id="proxSvg"></svg>
                <div class="zoom-controls">
                    <button class="zoom-btn" id="zmIn"  title="Zoom in">+</button>
                    <button class="zoom-btn" id="zmOut" title="Zoom out">−</button>
                    <button class="zoom-btn" id="zmReset" title="Reset view" style="font-size:.7rem">⌂</button>

/* ── MIND MAP D3 (3 degrees of connection, up to 25 people) ── */
const DEGREE_COLOR  = {0:'#E8B86D', 1:'#7C6FEB', 2:'#4ECDC4', 3:'#FF6B9D'};
const DEGREE_RADIUS = {1:90, 2:175, 3:255};
const DEGREE_SIZE   = {0:22, 1:14, 2:10, 3:7};
const DEGREE_LABEL  = {1:'Degree 1 · Closest Parallel', 2:'Degree 2 Connection', 3:'Degree 3 Connection'};

function truncateName(name, n){
    return name && name.length > n ? name.slice(0, n - 1) + '…' : (name || '');
}

function buildMindMap(graph, inputDate){
    const svg=d3.select('#proxSvg');
    svg.selectAll('*').remove();

    const nodes=(graph.nodes||[]).map(n=>({...n}));
    const links=(graph.links||[]).map(l=>({...l}));
    if(nodes.length===0) return;

    const W=660, H=660, cx=W/2, cy=H/2;
    svg.attr('viewBox',`0 0 ${W} ${H}`);

    // ── ZOOM BEHAVIOUR ──────────────────────────────────────────────────
    // All drawn content lives inside this single group so pan/zoom works.
    const zoom = d3.zoom()
        .scaleExtent([0.3, 4])
        .on('zoom', e => zoomLayer.attr('transform', e.transform));

    svg.call(zoom).on('dblclick.zoom', null); // disable dbl-click zoom

    const zoomLayer = svg.append('g').attr('id','zoomLayer');

    // Button wiring (safe: buttons may not exist in older renders)
    const btnIn    = document.getElementById('zmIn');
    const btnOut   = document.getElementById('zmOut');
    const btnReset = document.getElementById('zmReset');

    const stepZoom = (factor) => svg.transition().duration(250).call(zoom.scaleBy, factor);
    const resetZoom = () => svg.transition().duration(350).call(zoom.transform, d3.zoomIdentity);

    if(btnIn)    { btnIn.onclick    = () => stepZoom(1.35); }
    if(btnOut)   { btnOut.onclick   = () => stepZoom(1/1.35); }
    if(btnReset) { btnReset.onclick = resetZoom; }
    // ────────────────────────────────────────────────────────────────────

    const byId=new Map(nodes.map(n=>[n.id,n]));
    const childrenOf=new Map();
    links.forEach(l=>{
        if(!childrenOf.has(l.source)) childrenOf.set(l.source,[]);
        childrenOf.get(l.source).push(l.target);
    });

    // Radial placement: degree-1 spread evenly around the full circle;
    // each node's children fan out within a sector around its own angle.
    const angle=new Map();
    function place(parentId,parentAngle,sector){
        const kids=childrenOf.get(parentId)||[];
        const n=kids.length;
        kids.forEach((kid,i)=>{
            const a = n===1 ? parentAngle : parentAngle - sector/2 + sector*(i/(n-1));
            angle.set(kid,a);
            place(kid,a,(sector/Math.max(n,1))*0.9);
        });
    }
    const d1=childrenOf.get('you')||[];
    const N1=Math.max(d1.length,1);
    d1.forEach((id,i)=>{
        const a=-Math.PI/2 + i*(2*Math.PI/N1);
        angle.set(id,a);
        place(id,a,(2*Math.PI/N1)*0.85);
    });

    nodes.forEach(n=>{
        if(n.id==='you'){ n.x=cx; n.y=cy; return; }
        const a=angle.get(n.id)||0;
        const r=DEGREE_RADIUS[n.degree]||255;
        n.x=cx+Math.cos(a)*r;
        n.y=cy+Math.sin(a)*r;
    });

    // Defs / glow (attached to svg, not zoomLayer — filters are global)
    const defs=svg.append('defs');
    const filt=defs.append('filter').attr('id','glow');
    filt.append('feGaussianBlur').attr('stdDeviation','4').attr('result','blur');
    const fm=filt.append('feMerge');
    fm.append('feMergeNode').attr('in','blur');
    fm.append('feMergeNode').attr('in','SourceGraphic');

    // Orbit rings
    Object.values(DEGREE_RADIUS).forEach(r=>{
        zoomLayer.append('circle').attr('cx',cx).attr('cy',cy).attr('r',r)
            .attr('fill','none').attr('stroke','rgba(124,111,235,0.07)')
            .attr('stroke-dasharray','3 6');
    });

    // Links
    links.forEach((l,i)=>{
        const s=byId.get(l.source), t=byId.get(l.target);
        if(!s||!t) return;
        const op={1:.85,2:.55,3:.35}[t.degree]||.3;
        zoomLayer.append('line')
            .attr('x1',s.x).attr('y1',s.y).attr('x2',t.x).attr('y2',t.y)
            .attr('stroke',DEGREE_COLOR[t.degree]||'#4ECDC4')
            .attr('stroke-width',1.3).attr('stroke-dasharray','4 4')
            .attr('opacity',0)
            .transition().duration(700).delay(150+i*40).attr('opacity',op);

        zoomLayer.append('text')
            .attr('x',(s.x+t.x)/2).attr('y',(s.y+t.y)/2-4)
            .attr('text-anchor','middle').attr('font-size','7px')
            .attr('fill',DEGREE_COLOR[t.degree]).attr('opacity',0)
            .text(`${l.proximity}%`)
            .transition().duration(500).delay(450+i*40).attr('opacity',.75);
    });

    // Nodes
    const ng=zoomLayer.selectAll('.nd').data(nodes).enter().append('g')
        .attr('class','nd')
        .attr('transform',d=>`translate(${d.x},${d.y})`);

    ng.append('circle').attr('r',d=>(DEGREE_SIZE[d.degree]||7)+8)
        .attr('fill',d=>DEGREE_COLOR[d.degree]).attr('opacity',0.07);

    ng.append('circle').attr('r',d=>DEGREE_SIZE[d.degree]||7)
        .attr('fill',d=>DEGREE_COLOR[d.degree]).attr('opacity',0)
        .attr('filter','url(#glow)')
        .transition().duration(600).delay((d,i)=>i*55)
        .attr('opacity',d=>d.degree===0?.92:.8);

    // "You" star
    ng.filter(d=>d.degree===0).append('text')
        .attr('text-anchor','middle').attr('dy','.35em')
        .attr('font-size','12px').attr('fill','#fff').attr('opacity',0)
        .text('★')
        .transition().duration(500).delay(80).attr('opacity',1);

    // % labels inside degree 1/2 nodes
    ng.filter(d=>d.degree===1||d.degree===2).append('text')
        .attr('text-anchor','middle').attr('dy','.35em')
        .attr('font-size',d=>d.degree===1?'8px':'6.5px')
        .attr('fill','#fff').attr('font-weight','700').attr('opacity',0)
        .text(d=>`${d.proximity}%`)
        .transition().duration(500).delay((d,i)=>i*55+200).attr('opacity',.95);

    // Name labels
    ng.append('text')
        .attr('text-anchor','middle')
        .attr('dy',d=>(DEGREE_SIZE[d.degree]||7)+12)
        .attr('font-size',d=>d.degree===0?'11px':d.degree===1?'9px':'7.5px')
        .attr('fill',d=>DEGREE_COLOR[d.degree])
        .attr('font-family','Noto Serif JP,serif').attr('opacity',0)
        .text(d=>d.degree<=1?d.name:truncateName(d.name,11))
        .transition().duration(500).delay((d,i)=>i*55+250).attr('opacity',1);

    // Click -> modal, hover -> highlight
    ng.filter(d=>d.degree>0).style('cursor','pointer')
        .on('click',(event,d)=>{ event.stopPropagation(); openNodeModal(d); })
        .on('mouseover',function(){
            d3.select(this).select('circle:nth-child(2)').transition().duration(120).attr('opacity',1);
        })
        .on('mouseout',function(){
            d3.select(this).select('circle:nth-child(2)').transition().duration(120).attr('opacity',.8);
        });
}

/* ── NODE DETAIL MODAL ── */
// Wikipedia REST summary API: free, no key, CORS-open, returns thumbnail + extract
async function fetchWikiData(wdId, name) {
    // Step 1: resolve wd_id (e.g. "Q935") -> Wikipedia article title via Wikidata
    // Step 2: fetch Wikipedia summary for thumbnail + page URL
    // Falls back gracefully if either call fails or no article exists.
    if (!wdId || wdId === 'nan' || wdId === '') {
        // No wd_id stored — try by name directly
        return fetchWikiByName(name);
    }
    try {
        const wdUrl = `https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${encodeURIComponent(wdId)}&props=sitelinks&sitefilter=enwiki&format=json&origin=*`;
        const wdRes = await fetch(wdUrl);
        const wdData = await wdRes.json();
        const entity = wdData.entities?.[wdId];
        const title = entity?.sitelinks?.enwiki?.title;
        if (!title) return fetchWikiByName(name);
        return fetchWikiByTitle(title);
    } catch(e) {
        return fetchWikiByName(name);
    }
}

async function fetchWikiByName(name) {
    // Guess article title from name — works for most famous people
    return fetchWikiByTitle(name);
}

async function fetchWikiByTitle(title) {
    try {
        const url = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`;
        const res = await fetch(url);
        if (!res.ok) return null;
        const data = await res.json();
        return {
            thumb: data.thumbnail?.source || null,
            pageUrl: data.content_urls?.desktop?.page || `https://en.wikipedia.org/wiki/${encodeURIComponent(title)}`,
            extract: data.extract || null,
        };
    } catch(e) { return null; }
}

async function openNodeModal(d) {
    const parentLabel = d.parent === 'you' ? 'You' : d.parent;
    const themes = (d.themes && d.themes !== 'No context available' && !d.themes.includes('[auto-placeholder'))
        ? d.themes
        : null;

    // Render the modal immediately with what we have, then update with wiki data
    const modal = document.getElementById('nodeModalContent');
    modal.innerHTML =
        `<div class="tn">${d.name}</div>`
        + `<div class="td nm-meta">${DEGREE_LABEL[d.degree]||''} — ${d.proximity}% match to ${parentLabel}</div>`
        + `<div class="td nm-meta">${[d.domain, d.birthdate ? ('b. ' + d.birthdate) : ''].filter(Boolean).join(' · ')}</div>`
        + `<div class="td nm-stars">頭 ${d.head||'—'} · 胸 ${d.chest||'—'} · 天中殺 ${d.tenchu||'—'}</div>`
        + `<div class="nm-wiki-row" id="nmWikiRow"><div class="nm-img-wrap" id="nmImgWrap"><div class="nm-img-shimmer"></div></div><div id="nmWikiLink"></div></div>`
        + (themes ? `<div class="tt">${themes}</div>` : `<div class="tt nm-placeholder">Profile enrichment pending.</div>`);

    document.getElementById('nodeModalBackdrop').classList.add('open');

    // Async: fetch wiki data and slot it in
    const wiki = await fetchWikiData(d.wd_id, d.name);
    const imgWrap = document.getElementById('nmImgWrap');
    const wikiLink = document.getElementById('nmWikiLink');
    if (!imgWrap) return; // modal closed before fetch returned

    if (wiki?.thumb) {
        imgWrap.innerHTML = `<img class="nm-img" src="${wiki.thumb}" alt="${d.name}" loading="lazy">`;
    } else {
        imgWrap.innerHTML = `<div class="nm-img-fallback">${d.name.charAt(0)}</div>`;
    }

    if (wiki?.pageUrl) {
        wikiLink.innerHTML = `<a class="nm-wiki-link" href="${wiki.pageUrl}" target="_blank" rel="noopener">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            Wikipedia
        </a>`;
    }
}
function closeNodeModal(){
    document.getElementById('nodeModalBackdrop').classList.remove('open');
}
document.getElementById('nodeModalClose').addEventListener('click', closeNodeModal);
document.getElementById('nodeModalBackdrop').addEventListener('click', e=>{
    if(e.target.id==='nodeModalBackdrop') closeNodeModal();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeNodeModal(); });

/* ── MAIN FLOW ── */
async function calculateProfile(){
    const day  =document.getElementById('day').value;
    const month=document.getElementById('month').value;
    const year =document.getElementById('year').value;
    if(!day||!month||!year) return alert('Please enter a complete birthdate.');

    const token=turnstile.getResponse();
    if(!token) return alert('Please complete the security verification first.');

    const btn=document.getElementById('execBtn');
    btn.disabled=true;
    document.getElementById('loader').style.display='block';
    document.getElementById('dashboard').style.display='none';
    document.getElementById('metaDrawer').style.display='none';

    const msgs=[
        'Aligning solar-lunar bridge…',
        'Extracting heavenly stems & earthly branches…',
        'Computing 60-cycle matrix…',
        'Scanning historical parallels database…',
        'Initiating AI synthesis…'
    ];
    let mi=0;
    const tick=setInterval(()=>{
        mi=(mi+1)%msgs.length;
        document.getElementById('loaderMsg').textContent=msgs[mi];
    },1800);

    try{
        const res=await fetch('https://sanmei-project.onrender.com/api/analyze',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                day:parseInt(day),month:parseInt(month),
                year:parseInt(year),cf_token:token
            })
        });
        if(!res.ok) throw new Error('API error '+res.status);
        const data=await res.json();
        runtimeChart=data.chart;

        clearInterval(tick);
        document.getElementById('loader').style.display='none';
        document.getElementById('dashboard').style.display='block';

        // Yin grid
        if(data.chart.pillars){
            buildYinGrid(data.chart.pillars);
        }

        // Yang grid
        buildYangGrid(data.chart);
        document.getElementById('voidPill').textContent='天中殺 · '+data.chart.tenchusatsu;
        document.getElementById('voidVal').textContent=data.chart.tenchusatsu;

        // Mind map (replaces old 3-node proximity viz)
        const dStr=`${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        buildMindMap(data.mindmap||{nodes:[],links:[]}, dStr);

        // AI — shimmer while "loading", then reveal
        document.getElementById('aiStatus').textContent='Synthesizing cosmic interpretation…';
        document.getElementById('aiDot').className='ai-dot';
        document.getElementById('aiOut').innerHTML=
            ['83','67','91','58','76','88'].map(w=>
                `<div class="shimmer" style="width:${w}%"></div>`).join('');

        // Give a beat for the shimmer to show, then render
        setTimeout(()=>{
            document.getElementById('aiOut').innerHTML=marked.parse(data.ai_synthesis||'');
            document.getElementById('aiStatus').textContent='Interpretation complete';
            document.getElementById('aiDot').className='ai-dot done';
        },750);

    }catch(err){
        clearInterval(tick);
        document.getElementById('loader').style.display='none';
        alert('Error: '+err.message);
        console.error(err);
    }finally{
        btn.disabled=false;
        turnstile.reset();
    }
}
