<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>算命学 · Character Galaxy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#06060F;--deep:#0B0B18;--card:#10101E;--raised:#17172A;
  --vi:#7C6FEB;--vi-dim:rgba(124,111,235,.15);
  --gold:#E8B86D;--t1:#F0EEF8;--t2:#9E98BE;--t3:#524E6E;
  --b1:rgba(124,111,235,.12);--b2:rgba(124,111,235,.35);
  --wood:#4CAF82;--wood-dim:rgba(76,175,130,.18);
  --fire:#FF6B6B;--fire-dim:rgba(255,107,107,.18);
  --earth:#C8A85A;--earth-dim:rgba(200,168,90,.18);
  --metal:#A8B8D0;--metal-dim:rgba(168,184,208,.18);
  --water:#5B9BD5;--water-dim:rgba(91,155,213,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--void);color:var(--t1);font-family:'Inter',sans-serif}

/* Starfield */
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.s{position:absolute;border-radius:50%;background:#fff;animation:twk var(--t) ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes twk{from{opacity:var(--lo)}to{opacity:var(--hi)}}

/* Canvas */
#canvas{position:fixed;inset:0;z-index:1;cursor:grab;touch-action:none}
#canvas:active{cursor:grabbing}

/* Top bar */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:10;
  display:flex;align-items:center;gap:1rem;flex-wrap:wrap;
  padding:.8rem 1.2rem;background:rgba(6,6,15,.88);
  border-bottom:1px solid var(--b1);backdrop-filter:blur(14px);
}
.tb-title{font-family:'Noto Serif JP',serif;font-size:1rem;font-weight:300;letter-spacing:.18em;
  background:linear-gradient(135deg,#a89cf5,var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap}
.tb-sep{width:1px;height:22px;background:var(--b2);flex-shrink:0}
#searchBox{
  background:var(--raised);border:1px solid var(--b1);border-radius:10px;
  padding:.38rem .7rem;color:var(--t1);font-size:.78rem;width:170px;outline:none;
}
#searchBox::placeholder{color:var(--t3)}
#searchBox:focus{border-color:var(--vi)}
.filter-row{display:flex;gap:.35rem;flex-wrap:wrap}
.el-btn{
  padding:.25rem .65rem;border-radius:8px;border:1px solid transparent;
  font-size:.67rem;letter-spacing:.05em;cursor:pointer;font-family:'Inter',sans-serif;
  font-weight:500;transition:all .15s;background:var(--raised);color:var(--t2);
}
.el-btn.active{color:#fff}
.el-btn[data-el="All"].active  {border-color:var(--vi);background:var(--vi-dim);color:var(--t1)}
.el-btn[data-el="Wood"].active {border-color:var(--wood);background:var(--wood-dim);color:var(--wood)}
.el-btn[data-el="Fire"].active {border-color:var(--fire);background:var(--fire-dim);color:var(--fire)}
.el-btn[data-el="Earth"].active{border-color:var(--earth);background:var(--earth-dim);color:var(--earth)}
.el-btn[data-el="Metal"].active{border-color:var(--metal);background:var(--metal-dim);color:var(--metal)}
.el-btn[data-el="Water"].active{border-color:var(--water);background:var(--water-dim);color:var(--water)}
.zoom-ctrls{display:flex;gap:.3rem;margin-left:auto;flex-shrink:0}
.zbtn{
  width:27px;height:27px;border-radius:8px;border:1px solid var(--b2);
  background:var(--raised);color:var(--t2);font-size:1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.zbtn:hover{background:var(--b2);color:var(--t1)}
.back-btn{
  display:flex;align-items:center;gap:.4rem;padding:.28rem .72rem;
  border-radius:9px;border:1px solid var(--b1);background:var(--raised);
  color:var(--t2);font-size:.7rem;cursor:pointer;text-decoration:none;transition:all .15s;white-space:nowrap;
}
.back-btn:hover{border-color:var(--vi);color:var(--t1)}

/* Tooltip */
#tip{
  position:fixed;z-index:20;pointer-events:none;
  background:var(--raised);border:1px solid var(--b2);border-radius:12px;
  padding:.65rem .85rem;max-width:210px;opacity:0;transition:opacity .1s;
  box-shadow:0 8px 32px rgba(0,0,0,.5);
}
.tip-name{font-weight:600;color:var(--gold);font-size:.8rem;margin-bottom:.2rem;font-family:'Noto Serif JP',serif}
.tip-meta{color:var(--t3);font-size:.65rem;line-height:1.5}
.tip-arch{font-size:.65rem;margin-top:.2rem}
.tip-hint{color:var(--t3);font-size:.6rem;margin-top:.25rem;font-style:italic}

/* Side panel */
#panel{
  position:fixed;right:0;top:0;bottom:0;width:300px;
  background:rgba(11,11,24,.96);border-left:1px solid var(--b1);
  transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);
  z-index:15;display:flex;flex-direction:column;backdrop-filter:blur(16px);
}
#panel.open{transform:translateX(0)}
#pClose{
  position:absolute;top:.65rem;right:.7rem;width:27px;height:27px;
  border-radius:50%;border:none;background:transparent;color:var(--t2);font-size:1.2rem;cursor:pointer;
}
#pClose:hover{background:var(--b1);color:var(--t1)}
#pScroll{flex:1;overflow-y:auto;padding:2.6rem 1.1rem 1.1rem}
.p-name{font-family:'Noto Serif JP',serif;font-size:1rem;font-weight:700;
  color:var(--gold);margin-bottom:.28rem;line-height:1.3;padding-right:1.4rem}
.p-meta{color:var(--t3);font-size:.7rem;margin-bottom:.22rem;line-height:1.5}
.p-stars{font-family:'Noto Serif JP',serif;font-size:.7rem;color:var(--vi);margin-bottom:.55rem}
.p-pill{
  display:inline-flex;align-items:center;gap:.3rem;
  padding:.2rem .65rem;border-radius:20px;border:1px solid;font-size:.65rem;margin-bottom:.65rem;
}
.p-wiki-row{display:flex;align-items:flex-start;gap:.75rem;margin:.45rem 0 .65rem}
.p-img{flex-shrink:0;width:68px;height:68px;border-radius:9px;overflow:hidden;
  border:1px solid var(--b1);background:var(--card)}
.p-img img{width:100%;height:100%;object-fit:cover;display:block}
.p-img-shimmer{width:100%;height:100%;
  background:linear-gradient(90deg,var(--card) 25%,var(--raised) 50%,var(--card) 75%);
  background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.p-img-fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:1.6rem;font-weight:700;color:var(--t3);font-family:'Noto Serif JP',serif}
.p-wlink{
  display:inline-flex;align-items:center;gap:.3rem;font-size:.68rem;color:var(--vi);
  text-decoration:none;border:1px solid var(--b1);border-radius:8px;padding:.28rem .6rem;
  margin-top:.2rem;transition:background .15s;
}
.p-wlink:hover{background:var(--vi-dim);color:var(--t1)}
.p-divider{width:100%;height:1px;background:var(--b1);margin:.7rem 0}
.p-themes{color:var(--t2);font-size:.75rem;line-height:1.75}

/* Status */
#status{
  position:fixed;bottom:0;left:0;right:0;z-index:10;
  padding:.38rem 1.1rem;background:rgba(6,6,15,.75);
  border-top:1px solid var(--b1);backdrop-filter:blur(8px);
  display:flex;align-items:center;gap:1rem;
}
#sTxt{font-size:.67rem;color:var(--t3)}
#sInfo{font-size:.67rem;color:var(--t2);margin-left:auto}

/* Legend */
#legend{position:fixed;left:.9rem;bottom:2.2rem;z-index:10;display:flex;flex-direction:column;gap:.28rem}
.leg{display:flex;align-items:center;gap:.45rem;font-size:.62rem;color:var(--t3)}
.ld{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* Cluster label overlay (absolute positioned divs, cheaper than canvas text) */
#labels{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.cl{position:absolute;text-align:center;pointer-events:none;transform:translate(-50%,-50%);line-height:1.3}
.cl-arch{font-family:'Noto Serif JP',serif;font-size:13px;font-weight:400;opacity:.55}
.cl-count{font-size:9px;letter-spacing:.08em;opacity:.3;margin-top:1px}
</style>
</head>
<body>

<div id="stars"></div>
<canvas id="canvas"></canvas>
<div id="labels"></div>

<div id="topbar">
  <a href="index.html" class="back-btn">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    Chart
  </a>
  <div class="tb-sep"></div>
  <span class="tb-title">性格銀河 · Character Galaxy</span>
  <div class="tb-sep"></div>
  <input id="searchBox" placeholder="Search name…" autocomplete="off" spellcheck="false">
  <div class="filter-row">
    <button class="el-btn active" data-el="All">All</button>
    <button class="el-btn" data-el="Wood">木 Wood</button>
    <button class="el-btn" data-el="Fire">火 Fire</button>
    <button class="el-btn" data-el="Earth">土 Earth</button>
    <button class="el-btn" data-el="Metal">金 Metal</button>
    <button class="el-btn" data-el="Water">水 Water</button>
  </div>
  <div class="zoom-ctrls">
    <button class="zbtn" id="zIn">+</button>
    <button class="zbtn" id="zOut">−</button>
    <button class="zbtn" id="zReset" style="font-size:.68rem">⌂</button>
  </div>
</div>

<div id="tip">
  <div class="tip-name" id="tName"></div>
  <div class="tip-meta" id="tMeta"></div>
  <div class="tip-arch" id="tArch"></div>
  <div class="tip-hint">Click for full profile</div>
</div>

<div id="panel">
  <button id="pClose">&times;</button>
  <div id="pScroll">
    <div class="p-name" id="pName"></div>
    <div class="p-meta" id="pMeta"></div>
    <div class="p-stars" id="pStars"></div>
    <div class="p-pill" id="pPill"></div>
    <div class="p-wiki-row">
      <div class="p-img" id="pImgWrap"><div class="p-img-shimmer"></div></div>
      <div id="pWikiLink"></div>
    </div>
    <div class="p-divider"></div>
    <div class="p-themes" id="pThemes"></div>
  </div>
</div>

<div id="status"><div id="sTxt">Loading galaxy…</div><div id="sInfo"></div></div>
<div id="legend">
  <div class="leg"><div class="ld" style="background:var(--wood)"></div>木 Wood · Growth</div>
  <div class="leg"><div class="ld" style="background:var(--fire)"></div>火 Fire · Expression</div>
  <div class="leg"><div class="ld" style="background:var(--earth)"></div>土 Earth · Stability</div>
  <div class="leg"><div class="ld" style="background:var(--metal)"></div>金 Metal · Structure</div>
  <div class="leg"><div class="ld" style="background:var(--water)"></div>水 Water · Depth</div>
</div>

<script>
/* ── CONFIG ─────────────────────────────────────────────────────── */
const API_BASE = 'https://sanmei-project.onrender.com';
const NODE_R   = 3.5;   // dot radius in virtual coords
const HIT_R    = 12;    // hit-test radius

const EL_HEX = {
  Wood:'#4CAF82', Fire:'#FF6B6B', Earth:'#C8A85A',
  Metal:'#A8B8D0', Water:'#5B9BD5', '?':'#524E6E'
};
const EL_GLYPH = {Wood:'木', Fire:'火', Earth:'土', Metal:'金', Water:'水'};

// Wu Xing generating cycle: Wood→Fire→Earth→Metal→Water→Wood
const GENERATING = [['Wood','Fire'],['Fire','Earth'],['Earth','Metal'],['Metal','Water'],['Water','Wood']];
// Wu Xing controlling cycle: Wood→Earth→Water→Fire→Metal→Wood
const CONTROLLING= [['Wood','Earth'],['Earth','Water'],['Water','Fire'],['Fire','Metal'],['Metal','Wood']];

/* ── VIEWPORT ───────────────────────────────────────────────────── */
let tx=0, ty=0, scale=1, W=0, H=0;
function toScreen(vx,vy){ return [vx*scale+tx, vy*scale+ty]; }
function toVirtual(px,py){ return [(px-tx)/scale, (py-ty)/scale]; }

/* ── DATA ──────────────────────────────────────────────────────── */
let nodes=[], drawn=[], archetypesMeta={}, elCenters={}, blobR=420;
let activeEl='All', searchQ='';
let hoveredNode=null, selectedNode=null;

/* ── CANVAS ─────────────────────────────────────────────────────── */
const cvs = document.getElementById('canvas');
const ctx  = cvs.getContext('2d');

function resize(){
  W = cvs.width  = window.innerWidth;
  H = cvs.height = window.innerHeight;
  if(scale===1 && tx===0 && ty===0) fitAll();
  draw();
}
function fitAll(){
  const pad=100;
  // Bounding box of all nodes
  if(!nodes.length){ scale=0.18; tx=W/2-2000*scale; ty=H/2-2000*scale; return; }
  const xs=nodes.map(n=>n.x), ys=nodes.map(n=>n.y);
  const x0=Math.min(...xs)-blobR, x1=Math.max(...xs)+blobR;
  const y0=Math.min(...ys)-blobR, y1=Math.max(...ys)+blobR;
  scale = Math.min((W-pad*2)/(x1-x0), (H-pad*2-50)/(y1-y0));
  tx = (W-(x1+x0)*scale)/2;
  ty = (H-50-(y1+y0)*scale)/2 + 45;
}
window.addEventListener('resize', resize);

/* ── COLOUR HELPERS ─────────────────────────────────────────────── */
function hexToRgb(h){ return `${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)}`; }
const FULL={}, DIM={}, HOV={}, RING={};
Object.entries(EL_HEX).forEach(([el,hex])=>{
  const rgb=hexToRgb(hex);
  FULL[el] =`rgba(${rgb},.82)`; DIM[el]=`rgba(${rgb},.055)`;
  HOV[el]  =`rgba(${rgb},1)`;  RING[el]=`rgba(${rgb},.5)`;
});

/* ── DRAW ───────────────────────────────────────────────────────── */
function draw(){
  ctx.clearRect(0,0,W,H);

  // ── 1. Element circle boundaries ────────────────────────────────
  Object.entries(elCenters).forEach(([el,{x,y}])=>{
    if(activeEl!=='All' && el!==activeEl) return;
    const [sx,sy]=toScreen(x,y);
    const r=blobR*scale;
    const rgb=hexToRgb(EL_HEX[el]);

    // Outer subtle ring (dashed)
    ctx.save();
    ctx.setLineDash([6*scale,10*scale]);
    ctx.strokeStyle=`rgba(${rgb},.18)`;
    ctx.lineWidth=Math.max(1,1.5*scale);
    ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.stroke();
    ctx.restore();

    // Radial glow fill
    const grd=ctx.createRadialGradient(sx,sy,0,sx,sy,r);
    grd.addColorStop(0,  `rgba(${rgb},.07)`);
    grd.addColorStop(.55,`rgba(${rgb},.04)`);
    grd.addColorStop(1,  `rgba(${rgb},0)`);
    ctx.fillStyle=grd;
    ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.fill();
  });

  // ── 2. Wu Xing relationship lines ───────────────────────────────
  if(activeEl==='All' && scale>0.06){
    // Generating (生) — outer arcs connecting adjacent pentagon vertices
    GENERATING.forEach(([a,b])=>{
      const p=elCenters[a], q=elCenters[b];
      if(!p||!q) return;
      const [ax,ay]=toScreen(p.x,p.y);
      const [bx,by]=toScreen(q.x,q.y);
      const rgb=hexToRgb(EL_HEX[a]);
      ctx.save();
      ctx.strokeStyle=`rgba(${rgb},.22)`;
      ctx.lineWidth=Math.max(.8,1.4*scale);
      ctx.setLineDash([]);
      // Slightly curved: control point pushed outward from centre
      const mx=(ax+bx)/2, my=(ay+by)/2;
      const [cx2,cy2]=toScreen(2000,2000); // virtual centre
      const cpx=mx+(mx-cx2)*0.18, cpy=my+(my-cy2)*0.18;
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.quadraticCurveTo(cpx,cpy,bx,by); ctx.stroke();
      // Arrow head
      const angle=Math.atan2(by-cpy,bx-cpx);
      const aw=7*scale;
      ctx.fillStyle=`rgba(${rgb},.3)`;
      ctx.beginPath();
      ctx.moveTo(bx,by);
      ctx.lineTo(bx-aw*Math.cos(angle-0.4),by-aw*Math.sin(angle-0.4));
      ctx.lineTo(bx-aw*Math.cos(angle+0.4),by-aw*Math.sin(angle+0.4));
      ctx.closePath(); ctx.fill();
      ctx.restore();
    });

    // Controlling (克) — inner pentagram lines
    CONTROLLING.forEach(([a,b])=>{
      const p=elCenters[a], q=elCenters[b];
      if(!p||!q) return;
      const [ax,ay]=toScreen(p.x,p.y);
      const [bx,by]=toScreen(q.x,q.y);
      ctx.save();
      ctx.strokeStyle=`rgba(255,100,100,.12)`;
      ctx.lineWidth=Math.max(.5,0.9*scale);
      ctx.setLineDash([4*scale,8*scale]);
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
      ctx.restore();
    });
  }

  // ── 3. Element centre glyphs ─────────────────────────────────────
  if(scale > 0.055){
    Object.entries(elCenters).forEach(([el,{x,y}])=>{
      if(activeEl!=='All' && el!==activeEl) return;
      const [sx,sy]=toScreen(x,y);
      const rgb=hexToRgb(EL_HEX[el]);
      const fs=Math.max(14, 52*scale);

      // Kanji glyph at element centre
      ctx.save();
      ctx.globalAlpha=0.12;
      ctx.fillStyle=EL_HEX[el];
      ctx.font=`300 ${fs}px 'Noto Serif JP',serif`;
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText(EL_GLYPH[el], sx, sy);
      ctx.restore();

      // Element name label above glyph (only above a useful zoom level)
      if(scale > 0.1){
        const labelFs=Math.max(9, 14*scale);
        ctx.save();
        ctx.fillStyle=`rgba(${rgb},.55)`;
        ctx.font=`500 ${labelFs}px Inter,sans-serif`;
        ctx.textAlign='center';
        ctx.textBaseline='bottom';
        ctx.letterSpacing='0.1em';
        ctx.fillText(el.toUpperCase(), sx, sy - fs*0.6 - 4*scale);
        ctx.restore();
      }
    });
  }

  // ── 4. Nodes ─────────────────────────────────────────────────────
  const r=Math.max(1.2, NODE_R*scale);

  for(const n of drawn){
    const [sx,sy]=toScreen(n.x,n.y);
    if(sx<-r*4||sx>W+r*4||sy<-r*4||sy>H+r*4) continue;

    const isHov=n===hoveredNode, isSel=n===selectedNode;
    const nr=isHov||isSel ? r*2.2 : r;

    if(isHov||isSel){
      const rgb=hexToRgb(EL_HEX[n.he]||'#524E6E');
      const glow=ctx.createRadialGradient(sx,sy,0,sx,sy,nr*4);
      glow.addColorStop(0,`rgba(${rgb},.3)`);
      glow.addColorStop(1,`rgba(${rgb},0)`);
      ctx.fillStyle=glow;
      ctx.beginPath(); ctx.arc(sx,sy,nr*4,0,Math.PI*2); ctx.fill();
    }

    // Core dot (head element colour)
    ctx.fillStyle=n._dim ? DIM[n.he]||DIM['?'] : (isHov||isSel ? HOV[n.he] : FULL[n.he]||FULL['?']);
    ctx.beginPath(); ctx.arc(sx,sy,nr,0,Math.PI*2); ctx.fill();

    // Chest ring
    if(!n._dim && n.ce!==n.he){
      ctx.strokeStyle=RING[n.ce]||RING['?'];
      ctx.lineWidth=Math.max(.7, 1.3*scale);
      ctx.beginPath(); ctx.arc(sx,sy,nr+1.5*scale,0,Math.PI*2); ctx.stroke();
    }

    // Name on hover/select
    if(isHov||isSel){
      const fs=Math.max(10,12*scale);
      ctx.fillStyle='#F0EEF8';
      ctx.font=`500 ${fs}px Inter,sans-serif`;
      ctx.textAlign='center';
      ctx.textBaseline='bottom';
      ctx.fillText(n.n, sx, sy-nr-4*scale);
    }
  }
}

/* ── LABELS ─────────────────────────────────────────────────────── */
function updateLabels(){
  const container=document.getElementById('labels');
  container.innerHTML='';
  if(scale<0.09) return;

  Object.entries(elCenters).forEach(([el,{x,y}])=>{
    if(activeEl!=='All' && el!==activeEl) return;
    const [sx,sy]=toScreen(x,y);
    const r=blobR*scale;
    // Place label outside the circle, toward the outside of the pentagon
    const cx2=toScreen(2000,2000)[0], cy2=toScreen(2000,2000)[1];
    const dx=sx-cx2, dy=sy-cy2;
    const len=Math.sqrt(dx*dx+dy*dy)||1;
    const lx=sx+(dx/len)*(r+18), ly=sy+(dy/len)*(r+18);
    if(lx<0||lx>W||ly<40||ly>H) return;

    const count=Object.entries(archetypesMeta)
      .filter(([a])=>a.startsWith(el+'/'))
      .reduce((s,[,v])=>s+v.count,0);

    const div=document.createElement('div');
    div.className='cl';
    div.style.left=lx+'px';
    div.style.top=ly+'px';
    div.style.color=EL_HEX[el];
    div.innerHTML=
      `<div class="cl-arch">${EL_GLYPH[el]} ${el}</div>`+
      `<div class="cl-count">${count} people</div>`;
    container.appendChild(div);
  });
}

/* ── PAN / ZOOM ─────────────────────────────────────────────────── */
let drag=null;
cvs.addEventListener('mousedown',e=>{ if(e.button!==0)return; drag={sx:e.clientX,sy:e.clientY,tx,ty}; });
window.addEventListener('mousemove',e=>{
  if(drag){ tx=drag.tx+(e.clientX-drag.sx); ty=drag.ty+(e.clientY-drag.sy); draw(); updateLabels(); return; }
  handleHover(e.clientX,e.clientY);
});
window.addEventListener('mouseup',()=>{ drag=null; });
cvs.addEventListener('wheel',e=>{ e.preventDefault(); zoomAt(e.clientX,e.clientY,e.deltaY<0?1.12:1/1.12); },{passive:false});

let lastPinch=null;
cvs.addEventListener('touchstart',e=>{ if(e.touches.length===2){lastPinch=pDist(e);drag=null;}else if(e.touches.length===1){const t=e.touches[0];drag={sx:t.clientX,sy:t.clientY,tx,ty};} },{passive:true});
cvs.addEventListener('touchmove',e=>{
  if(e.touches.length===2&&lastPinch){const d=pDist(e);zoomAt((e.touches[0].clientX+e.touches[1].clientX)/2,(e.touches[0].clientY+e.touches[1].clientY)/2,d/lastPinch);lastPinch=d;}
  else if(e.touches.length===1&&drag){const t=e.touches[0];tx=drag.tx+(t.clientX-drag.sx);ty=drag.ty+(t.clientY-drag.sy);draw();updateLabels();}
  e.preventDefault();
},{passive:false});
cvs.addEventListener('touchend',()=>{drag=null;lastPinch=null;});
function pDist(e){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;return Math.sqrt(dx*dx+dy*dy);}
function zoomAt(px,py,f){const ns=Math.min(10,Math.max(0.03,scale*f));tx=px-(px-tx)*(ns/scale);ty=py-(py-ty)*(ns/scale);scale=ns;draw();updateLabels();}

document.getElementById('zIn').onclick    =()=>zoomAt(W/2,H/2,1.4);
document.getElementById('zOut').onclick   =()=>zoomAt(W/2,H/2,1/1.4);
document.getElementById('zReset').onclick =()=>{fitAll();draw();updateLabels();};

/* ── HIT TEST ───────────────────────────────────────────────────── */
function hitTest(px,py){
  const [vx,vy]=toVirtual(px,py);
  const vHit=HIT_R/scale;
  let best=null,bestD2=vHit*vHit;
  for(const n of drawn){ const dx=n.x-vx,dy=n.y-vy,d2=dx*dx+dy*dy; if(d2<bestD2){bestD2=d2;best=n;} }
  return best;
}
function handleHover(px,py){
  const tip=document.getElementById('tip');
  const n=hitTest(px,py);
  if(n!==hoveredNode){
    hoveredNode=n; draw();
    if(n){
      document.getElementById('tName').textContent=n.n;
      document.getElementById('tMeta').textContent=[n.d,n.b?'b. '+n.b:''].filter(Boolean).join(' · ');
      document.getElementById('tArch').innerHTML=
        `<span style="color:${EL_HEX[n.he]}">${n.he}</span>`+
        ` <span style="color:#524E6E">▸</span> `+
        `<span style="color:${EL_HEX[n.ce]}">${n.ce}</span>`+
        `<span style="color:#524E6E;font-size:.6rem"> · ${n.h} / ${n.c}</span>`;
      const tw=220,th=85;
      tip.style.left=(px+14+tw>W?px-tw-10:px+14)+'px';
      tip.style.top =(py+th>H?py-th:py+10)+'px';
      tip.style.opacity='1';
    } else { tip.style.opacity='0'; }
  }
}
cvs.addEventListener('click',e=>{
  const n=hitTest(e.clientX,e.clientY);
  if(n){selectedNode=n;openPanel(n);draw();}
  else{closePanel();selectedNode=null;draw();}
});

/* ── FILTER ─────────────────────────────────────────────────────── */
function applyFilter(){
  const q=searchQ.toLowerCase(),el=activeEl;
  drawn=nodes.map(n=>{
    const em=el==='All'||n.he===el||n.ce===el;
    const qm=!q||n.n.toLowerCase().includes(q)||(n.d||'').toLowerCase().includes(q);
    return {...n,_dim:!(em&&qm)};
  });
  const vis=drawn.filter(n=>!n._dim).length;
  document.getElementById('sTxt').textContent=`${vis} of ${nodes.length} people`;
  document.getElementById('sInfo').textContent=el!=='All'?`${EL_GLYPH[el]||''} ${el} element`:`5 elements · ${Object.keys(archetypesMeta).length} archetypes`;
  draw(); updateLabels();
}
document.querySelectorAll('.el-btn').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.el-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); activeEl=btn.dataset.el; applyFilter();
}));
document.getElementById('searchBox').addEventListener('input',e=>{searchQ=e.target.value;applyFilter();});

/* ── SIDE PANEL ─────────────────────────────────────────────────── */
function openPanel(n){
  const hCol=EL_HEX[n.he]||'#524E6E',cCol=EL_HEX[n.ce]||'#524E6E';
  document.getElementById('pName').textContent=n.n;
  document.getElementById('pMeta').textContent=[n.d,n.b?'b. '+n.b:''].filter(Boolean).join(' · ');
  document.getElementById('pStars').textContent=`頭 ${n.h||'—'} · 胸 ${n.c||'—'} · 天中殺 ${n.k||'—'}`;
  const pill=document.getElementById('pPill');
  pill.style.borderColor=hCol; pill.style.color=hCol;
  pill.innerHTML=`<span style="color:${hCol}">${n.he}</span><span style="color:#524E6E"> ▸ </span><span style="color:${cCol}">${n.ce}</span><span style="color:#524E6E;font-weight:300"> · ${(archetypesMeta[n.a]||{}).description||''}</span>`;
  document.getElementById('pThemes').textContent=n.t&&!n.t.includes('[auto-placeholder')?n.t:'Profile enrichment pending.';
  document.getElementById('pImgWrap').innerHTML='<div class="p-img-shimmer"></div>';
  document.getElementById('pWikiLink').innerHTML='';
  document.getElementById('panel').classList.add('open');
  fetchWiki(n.w,n.n).then(wiki=>{
    const iw=document.getElementById('pImgWrap'),wl=document.getElementById('pWikiLink');
    if(!iw)return;
    iw.innerHTML=wiki?.thumb?`<img src="${wiki.thumb}" alt="${n.n}" loading="lazy" style="width:100%;height:100%;object-fit:cover">`:`<div class="p-img-fb">${n.n.charAt(0)}</div>`;
    if(wiki?.pageUrl&&wl) wl.innerHTML=`<a class="p-wlink" href="${wiki.pageUrl}" target="_blank" rel="noopener"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>Wikipedia</a>`;
  });
}
function closePanel(){document.getElementById('panel').classList.remove('open');}
document.getElementById('pClose').addEventListener('click',closePanel);

/* ── WIKIPEDIA ──────────────────────────────────────────────────── */
async function fetchWiki(wdId,name){
  if(!wdId||wdId==='nan'||!wdId.trim())return fetchWikiT(name);
  try{const r=await fetch(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${encodeURIComponent(wdId)}&props=sitelinks&sitefilter=enwiki&format=json&origin=*`);const d=await r.json();const t=d.entities?.[wdId]?.sitelinks?.enwiki?.title;return t?fetchWikiT(t):fetchWikiT(name);}catch(e){return fetchWikiT(name);}
}
async function fetchWikiT(t){
  try{const r=await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(t)}`);if(!r.ok)return null;const d=await r.json();return{thumb:d.thumbnail?.source||null,pageUrl:d.content_urls?.desktop?.page||null};}catch(e){return null;}
}

/* ── STARFIELD ──────────────────────────────────────────────────── */
(function(){const c=document.getElementById('stars');for(let i=0;i<100;i++){const s=document.createElement('div');s.className='s';const sz=Math.random()*1.6+.3;s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--t:${2+Math.random()*4}s;--d:${Math.random()*4}s;--lo:${.05+Math.random()*.2};--hi:${.4+Math.random()*.5}`;c.appendChild(s);}})();

/* ── BOOT ───────────────────────────────────────────────────────── */
async function loadData(){
  try{
    const res=await fetch(`${API_BASE}/api/galaxy`);
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const data=await res.json();
    nodes=data.nodes||[];
    archetypesMeta=data.archetypes||{};
    elCenters=data.el_centers||{};
    blobR=data.blob_r||420;
    drawn=nodes.map(n=>({...n,_dim:false}));
    document.getElementById('sTxt').textContent=`${nodes.length} people · 5 elements`;
    document.getElementById('sInfo').textContent='Scroll to zoom · Drag to pan · Click for profile';
    resize();
    updateLabels();
  }catch(e){document.getElementById('sTxt').textContent=`Error: ${e.message}`;}
}

resize();
loadData();
</script>
